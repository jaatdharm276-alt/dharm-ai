plugins {
    id "com.android.application"
}

android {
    namespace "ai.dharm.orion"
    compileSdk 35

    defaultConfig {
        applicationId "ai.dharm.orion"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }
}
