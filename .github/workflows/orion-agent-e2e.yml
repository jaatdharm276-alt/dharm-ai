name: ORION Live Agent Search E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "scripts/smoke-orion-agent.mjs"
      - ".github/workflows/orion-agent-e2e.yml"

permissions:
  contents: read

jobs:
  live-agent-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve the PR preview URL
        run: |
          branch_slug="${GITHUB_HEAD_REF//\//-}"
          echo "ORION_AGENT_URL=https://dharm-ai-git-${branch_slug}-dharm-ai.vercel.app/api/agent" >> "$GITHUB_ENV"
      - name: Wait for the PR preview deployment
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" "$ORION_AGENT_URL" || true)
            if [ "$status" = "405" ]; then
              echo "PR preview is ready (API route returned HTTP 405 to GET)."
              exit 0
            fi
            echo "Waiting for preview deployment (attempt $attempt/60, HTTP ${status:-none})..."
            sleep 5
          done
          echo "PR preview did not become ready within five minutes."
          exit 1
      - name: Test deployed ORION Agent end-to-end
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/smoke-orion-agent.mjs
