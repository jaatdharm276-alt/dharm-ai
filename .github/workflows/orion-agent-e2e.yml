name: ORION Live Agent Search E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "scripts/smoke-orion-agent.mjs"
      - ".github/workflows/orion-agent-e2e.yml"

permissions:
  contents: read

jobs:
  live-agent-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the latest Production API
        env:
          ORION_AGENT_URL: https://dharm-ai.vercel.app/api/agent
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$ORION_AGENT_URL" || true)
            if [ "$status" = "405" ]; then
              echo "Production API is ready (API route returned HTTP 405 to GET)."
              exit 0
            fi
            echo "Waiting for Production API (attempt $attempt/60, HTTP ${status:-none})..."
            sleep 5
          done
          echo "Production API did not become ready within five minutes."
          exit 1
      - name: Test latest Production ORION Agent end-to-end
        env:
          ORION_AGENT_URL: https://dharm-ai.vercel.app/api/agent
        run: node scripts/smoke-orion-agent.mjs
