name: ORION Live Agent Search E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "scripts/smoke-orion-agent.mjs"
      - "lib/orion-agent-e2e-assertions.mjs"
      - "app/api/agent/route.js"
      - ".github/workflows/orion-agent-e2e.yml"

permissions:
  contents: read

jobs:
  live-agent-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve deployment URL and expected commit
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            branch_slug="${GITHUB_HEAD_REF//\\//-}"
            deployment_base="https://dharm-ai-git-${branch_slug}-dharm-ai.vercel.app"
            expected_sha="$PR_HEAD_SHA"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            deployment_base="https://dharm-ai.vercel.app"
            expected_sha="$GITHUB_SHA"
          else
            branch_slug="${GITHUB_REF_NAME//\\//-}"
            deployment_base="https://dharm-ai-git-${branch_slug}-dharm-ai.vercel.app"
            expected_sha="$GITHUB_SHA"
          fi
          if [[ ! "$expected_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the expected full commit SHA."
            exit 1
          fi
          echo "ORION_AGENT_URL=${deployment_base}/api/agent" >> "$GITHUB_ENV"
          echo "ORION_EXPECTED_DEPLOYMENT_SHA=$expected_sha" >> "$GITHUB_ENV"
      - name: Wait for the exact PR preview endpoint
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" "$ORION_AGENT_URL" || true)
            if [ "$status" = "405" ]; then
              echo "Deployment endpoint is responding; the POST smoke test will verify its exact commit SHA."
              exit 0
            fi
            echo "Waiting for deployment (attempt $attempt/60, HTTP ${status:-none})..."
            sleep 5
          done
          echo "Deployment endpoint did not become ready within five minutes."
          exit 1
      - name: Test deployed ORION Agent end-to-end
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ORION_EXPECTED_DEPLOYMENT_SHA: ${{ env.ORION_EXPECTED_DEPLOYMENT_SHA }}
        run: node scripts/smoke-orion-agent.mjs
