name: ORION AI CI
# Keep this gate enabled for the production-security hardening PR.
# Validate the final verifier flow and Upstash config checks before merge.

on:
  push:
    branches:
      - main
      - "orion-ai/**"
      - "hardening/orion-production-security"
      - "feature/orion-local-offline-engine"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Run unit tests
        run: npm test
      - name: Build application
        run: npm run build
